name: server-build

# Slim build for a self-hosted fork: static Linux binaries plus a Windows build.
# Upstream's build.yaml still targets tags and Docker Hub, so it is left alone.

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'db_v2.sqlite3'
      - '.env'
      - '.github/workflows/server-build.yaml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Native builds per architecture, not a cross build. `native-tls` (pulled in by
  # tokio-tungstenite via hbb_common) needs an OpenSSL for the target, and
  # neither a plain musl build nor the cross musl images provide one. Building on
  # the matching host with the distro's libssl-dev is the variant that reliably
  # works; the tradeoff is a glibc/OpenSSL3 runtime dependency instead of a fully
  # static binary.
  linux:
    name: linux ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            artifact: linux-amd64
          - runner: ubuntu-22.04-arm
            artifact: linux-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install OpenSSL headers
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.artifact }}-cargo-${{ hashFiles('Cargo.lock') }}

      # `sqlx::query!` needs the schema at compile time, which is why the
      # checked-in db_v2.sqlite3 and .env must stay in the tree.
      - name: Build
        run: cargo build --release --locked --bin hbbs --bin hbbr

      - name: Collect binaries
        run: |
          mkdir -p dist
          cp target/release/hbbs target/release/hbbr dist/
          strip dist/hbbs dist/hbbr 2>/dev/null || true
          (cd dist && sha256sum hbbs hbbr > SHA256SUMS)
          echo "--- runtime dependencies ---"
          ldd dist/hbbs || true

      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-server-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: windows x86_64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-msvc-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked --bin hbbs --bin hbbr

      - name: Collect binaries
        run: |
          mkdir dist
          copy target\release\hbbs.exe dist\
          copy target\release\hbbr.exe dist\

      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-server-windows-amd64
          path: dist/*
          if-no-files-found: error
