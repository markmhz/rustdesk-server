name: server-build

# Slim build for a self-hosted fork: static Linux binaries plus a Windows build.
# Upstream's build.yaml still targets tags and Docker Hub, so it is left alone.

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'db_v2.sqlite3'
      - '.env'
      - '.github/workflows/server-build.yaml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux ${{ matrix.target }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: linux-amd64
          - target: aarch64-unknown-linux-musl
            artifact: linux-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-musl" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
            {
              echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc"
              echo "CC_aarch64_unknown_linux_musl=aarch64-linux-gnu-gcc"
              echo "AR_aarch64_unknown_linux_musl=aarch64-linux-gnu-ar"
            } >> "$GITHUB_ENV"
          fi

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('Cargo.lock') }}

      # `sqlx::query!` needs the schema at compile time, which is why the
      # checked-in db_v2.sqlite3 and .env must stay in the tree.
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} --bin hbbs --bin hbbr

      - name: Collect binaries
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/hbbs" dist/
          cp "target/${{ matrix.target }}/release/hbbr" dist/
          strip dist/hbbs dist/hbbr 2>/dev/null || true
          (cd dist && sha256sum hbbs hbbr > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-server-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: windows x86_64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-msvc-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --locked --bin hbbs --bin hbbr

      - name: Collect binaries
        run: |
          mkdir dist
          copy target\release\hbbs.exe dist\
          copy target\release\hbbr.exe dist\

      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-server-windows-amd64
          path: dist/*
          if-no-files-found: error
